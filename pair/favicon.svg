<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Flick logo">
  <title>Flick</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#0a6cf0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <g transform="rotate(-6 256 256)">
    <!-- motion trail -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-width="18" fill="none">
      <line x1="256" y1="384" x2="256" y2="452" opacity="0.75"/>
      <line x1="206" y1="384" x2="206" y2="424" opacity="0.45"/>
      <line x1="306" y1="384" x2="306" y2="424" opacity="0.45"/>
    </g>

    <!-- card with swipe-up arrow -->
    <rect x="150" y="80" width="212" height="272" rx="34" fill="#ffffff"/>
    <path d="M196 236 L256 176 L316 236" fill="none" stroke="#0a84ff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="256" y1="184" x2="256" y2="298" stroke="#0a84ff" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
