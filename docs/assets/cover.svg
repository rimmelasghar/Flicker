<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Flick: flick photos from your phone straight onto your laptop">
  <title>Flick</title>
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#0a6cf0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ecff"/>
      <stop offset="1" stop-color="#b6d9ff"/>
    </linearGradient>
    <clipPath id="flyPhoto">
      <rect x="-30" y="-38" width="60" height="56" rx="4"/>
    </clipPath>
    <clipPath id="phoneScreen">
      <rect x="752" y="262" width="156" height="320" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="#0e0e12"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Brand block -->
  <g transform="translate(96 150) scale(0.234)">
    <rect width="512" height="512" rx="114" fill="url(#markBg)"/>
    <g transform="rotate(-6 256 256)">
      <g stroke="#ffffff" stroke-linecap="round" stroke-width="18" fill="none">
        <line x1="256" y1="384" x2="256" y2="452" opacity="0.75"/>
        <line x1="206" y1="384" x2="206" y2="424" opacity="0.45"/>
        <line x1="306" y1="384" x2="306" y2="424" opacity="0.45"/>
      </g>
      <rect x="150" y="80" width="212" height="272" rx="34" fill="#ffffff"/>
      <path d="M196 236 L256 176 L316 236" fill="none" stroke="#0a84ff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="256" y1="184" x2="256" y2="298" stroke="#0a84ff" stroke-width="34" stroke-linecap="round"/>
    </g>
  </g>
  <text x="240" y="244" fill="#f5f5f7" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3">Flick</text>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="338" fill="#f5f5f7" font-size="40" font-weight="500">Flick photos from your phone</text>
    <text x="96" y="390" fill="#f5f5f7" font-size="40" font-weight="500">straight onto your laptop.</text>

    <g font-size="21" fill="#b8b8be">
      <rect x="96" y="440" width="150" height="44" rx="22" fill="#1c1c1f" stroke="#2e2e35" stroke-width="2"/>
      <text x="171" y="469" text-anchor="middle">Same Wi‑Fi</text>
      <rect x="260" y="440" width="130" height="44" rx="22" fill="#1c1c1f" stroke="#2e2e35" stroke-width="2"/>
      <text x="325" y="469" text-anchor="middle">No cloud</text>
      <rect x="404" y="440" width="150" height="44" rx="22" fill="#1c1c1f" stroke="#2e2e35" stroke-width="2"/>
      <text x="479" y="469" text-anchor="middle">No app install</text>
    </g>

    <text x="96" y="560" fill="#6e6e76" font-size="20">One Docker container on the laptop · a web page on the phone</text>
  </g>

  <!-- Laptop -->
  <g>
    <rect x="962" y="118" width="250" height="164" rx="14" fill="#1c1c1f" stroke="#3a3a42" stroke-width="4"/>
    <rect x="976" y="132" width="222" height="136" rx="6" fill="#141418"/>
    <!-- desktop with landed photos -->
    <g>
      <rect x="994" y="150" width="44" height="40" rx="5" fill="#2a2a31"/>
      <rect x="1052" y="150" width="44" height="40" rx="5" fill="#2a2a31"/>
      <rect x="994" y="206" width="44" height="40" rx="5" fill="#2a2a31"/>
      <rect x="1052" y="206" width="44" height="40" rx="5" fill="#0a84ff"/>
      <polygon points="1056,242 1068,224 1076,234 1084,220 1092,242" fill="#d9ecff" opacity="0.9"/>
      <circle cx="1146" cy="200" r="26" fill="none" stroke="#0a84ff" stroke-width="3" opacity="0.5"/>
      <circle cx="1146" cy="200" r="42" fill="none" stroke="#0a84ff" stroke-width="2" opacity="0.22"/>
      <path d="M1135 200 l8 8 l14 -16" fill="none" stroke="#30d158" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M934 286 H1240 L1226 304 Q1222 308 1214 308 H960 Q952 308 948 304 Z" fill="#2a2a31" stroke="#3a3a42" stroke-width="3"/>
  </g>

  <!-- Flight path -->
  <path d="M840 246 C 830 160, 880 120, 958 150" fill="none" stroke="#0a84ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.8"/>

  <!-- Flying photo -->
  <g transform="translate(872 150) rotate(18)">
    <rect x="-38" y="-46" width="76" height="88" rx="8" fill="#ffffff"/>
    <g clip-path="url(#flyPhoto)">
      <rect x="-30" y="-38" width="60" height="56" fill="url(#sky)"/>
      <circle cx="14" cy="-24" r="6" fill="#ffffff"/>
      <polygon points="-34,22 -10,-12 2,4 14,-16 34,14 34,22" fill="#5bb0ff"/>
      <polygon points="-34,22 -10,-12 2,4 -6,22" fill="#0a84ff"/>
    </g>
  </g>

  <!-- Phone -->
  <g transform="rotate(-10 830 420)">
    <rect x="740" y="250" width="180" height="344" rx="32" fill="#1c1c1f" stroke="#3a3a42" stroke-width="4"/>
    <g clip-path="url(#phoneScreen)">
      <rect x="752" y="262" width="156" height="320" fill="#141418"/>
      <!-- ghost of the card that left -->
      <rect x="784" y="330" width="92" height="108" rx="10" fill="none" stroke="#3a3a42" stroke-width="3" stroke-dasharray="6 8"/>
      <g stroke="#0a84ff" stroke-linecap="round" stroke-width="6" fill="none">
        <line x1="830" y1="452" x2="830" y2="500" opacity="0.8"/>
        <line x1="806" y1="456" x2="806" y2="484" opacity="0.45"/>
        <line x1="854" y1="456" x2="854" y2="484" opacity="0.45"/>
      </g>
      <circle cx="830" cy="540" r="7" fill="#30d158"/>
    </g>
    <rect x="806" y="270" width="48" height="10" rx="5" fill="#0e0e12"/>
  </g>
</svg>
